[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprahari"
version = "0.1.0"
description = "A robust, enterprise-grade, drop-in security & safety guardrail layer for AI agents and LLMs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "AgentPrahari Team" }
]
keywords = [
    "ai", "llm", "guardrails", "security", "safety", 
    "prompt-injection", "jailbreak", "pii-masking", "agent-safety"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
judge = ["requests>=2.25.0"]
all = ["requests>=2.25.0", "pytest>=7.0.0"]
test = ["pytest>=7.0.0"]

[project.scripts]
agentprahari = "agentprahari.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentprahari*"]
